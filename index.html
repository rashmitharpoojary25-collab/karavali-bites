<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karavali Bites</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#a8643c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KB Sales">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#fffaf3;--card:#fff;--tx:#2b2118;--mu:#7a6a5a;--ac:#c2410c;--bd:#eadfce;--cash:#15803d;--upi:#1d4ed8;--bad:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1511;--card:#271e18;--tx:#f5ebe0;--mu:#b5a493;--ac:#fb923c;--bd:#3d3027;--cash:#4ade80;--upi:#60a5fa;--bad:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1511;--card:#271e18;--tx:#f5ebe0;--mu:#b5a493;--ac:#fb923c;--bd:#3d3027;--cash:#4ade80;--upi:#60a5fa;--bad:#f87171;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:560px;margin-inline:auto;padding:12px}
h1{font-size:20px;margin:4px 0}h2{font-size:15px;margin:18px 0 8px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:8px}
.item{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}
.nm b{display:block}.nm span{color:var(--mu);font-size:13px}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;color:#fff;cursor:pointer;min-width:64px}
.c{background:var(--cash)}.u{background:var(--upi)}.g{background:var(--bd);color:var(--tx)}.r{background:var(--bad)}
.c,.u{color:#0b0b0b}
input{font:inherit;padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);width:100%}
.row{display:flex;gap:8px;margin-bottom:8px}.row>*{flex:1}
table{width:100%;border-collapse:collapse}td{padding:6px 0;border-bottom:1px solid var(--bd)}td:last-child{text-align:right;font-weight:600}
.big td{font-size:17px}.ok{color:var(--cash)}.no{color:var(--bad)}
.log{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;border-bottom:1px solid var(--bd)}
.top{display:flex;justify-content:space-between;align-items:center}
.sm{font-size:13px;color:var(--mu)}
.qb{min-width:0;padding:10px 0;font-weight:600}.item2{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px;align-items:center;margin-top:8px}.stp{display:flex;align-items:center;gap:6px}.stp b{min-width:24px;text-align:center;font-size:18px}.stp .qb{width:42px;font-size:20px}
.srow{display:grid;grid-template-columns:1fr 90px;gap:8px;align-items:center;padding:4px 0}
#toast{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:536px;margin:auto;background:var(--tx);color:var(--bg);padding:14px;border-radius:12px;font-weight:600;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
</style>
</head>
<body>
<div class="top"><div style="display:flex;align-items:center;gap:10px"><img id="lg" src="logo.png" alt="" width="46" height="46" style="border-radius:50%"><h1>Karavali Bites</h1></div><span class="sm" id="dt"></span></div>

<h2>Prepared today</h2>
<div class="card" id="stock"></div>
<div class="sm">Enter how many you made. Leave blank for no limit.</div>
<h2>Tap to add a sale</h2>
<div class="sm">Use + / − for quantity, then tap Cash or UPI</div>
<div id="menu" style="margin-top:6px"></div>
<div class="row"><button class="g" onclick="undo()">Undo last</button></div>

<h2>Today’s summary</h2>
<div class="card"><table class="big" id="sum"></table></div>

<h2>Cash check</h2>
<div class="card">
<div class="row"><div><label class="sm">Opening cash (float)</label><input id="open" type="number" inputmode="numeric" placeholder="0" oninput="setF('open',this.value)"></div>
<div><label class="sm">Cash counted at end</label><input id="cnt" type="number" inputmode="numeric" placeholder="0" oninput="setF('cnt',this.value)"></div></div>
<table id="chk"></table>
</div>

<h2>Expenses</h2>
<div class="card">
<div class="row"><input id="ea" type="number" inputmode="numeric" placeholder="Amount ₹"><input id="en" placeholder="What for?"></div>
<div class="row"><button class="c" onclick="addE('cash')">Paid cash</button><button class="u" onclick="addE('upi')">Paid UPI</button></div>
<div id="elog"></div>
</div>

<h2>Today’s sales log</h2>
<div class="card" id="slog"></div>

<div class="row"><button class="u" onclick="pdf()">Download day report (PDF)</button></div>
<div class="row"><button class="g" onclick="copySum()">Copy summary</button><button class="r" id="rb" onclick="resetDay()">Clear today</button></div>
<p class="sm" id="msg"></p>
<div id="toast"></div>

<h2>Past days</h2>
<div class="card" id="hist"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
var MENU=[["Choco loaded tub",150],["Brownie kunafa",130],["Pista kunafa",140],["Classic tiramisu",100],["Biscoff tiramisu",140],["Cold coffee",60]];
var KEY="kb-days-v1",days={},mem={},qs=[1,1,1,1,1,1];
function load(){try{days=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){days=mem}}
function save(){mem=days;try{localStorage.setItem(KEY,JSON.stringify(days))}catch(e){}}
function dk(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
var T=dk();
function D(){T=dk();if(!days[T])days[T]={open:"",cnt:"",s:[],e:[],p:[]};var z=days[T];if(!z.p)z.p=[];return z}
function inr(n){return "₹"+Number(n||0).toLocaleString("en-IN")}
function stp(i,d){qs[i]=Math.max(1,Math.min(20,qs[i]+d));render()}
function toast(t){var e=document.getElementById("toast");e.textContent=t;e.style.opacity=1;clearTimeout(window._tt);window._tt=setTimeout(function(){e.style.opacity=0},2000);try{if(navigator.vibrate)navigator.vibrate(40)}catch(x){}}
function soldOf(i){return D().s.reduce(function(a,x){return a+(x.i==i?(x.q||1):0)},0)}
function stat(i){var p=D().p[i];if(p==null||p==="")return "";var l=p-soldOf(i);return l<=0?" · <b style='color:var(--bad)'>SOLD OUT</b>":" · left "+l}
function setP(i,v){D().p[i]=v===""?"":Math.max(0,+v);save();render()}
function buildStock(){document.getElementById("stock").innerHTML=MENU.map(function(m,i){return "<div class='srow'><span>"+m[0]+"</span><input id='p"+i+"' type='number' inputmode='numeric' min='0' placeholder='0' oninput='setP("+i+",this.value)'></div>"}).join("")}
function syncStock(){var p=D().p;MENU.forEach(function(m,i){var e=document.getElementById("p"+i);if(e&&document.activeElement!==e)e.value=p[i]==null?"":p[i]})}
function add(i,m){var q=qs[i],p=D().p[i];if(p!=null&&p!==""&&p-soldOf(i)<q){var l=p-soldOf(i);toast(l<=0?MENU[i][0]+" is sold out":"Only "+l+" left of "+MENU[i][0]);return}D().s.push({i:i,m:m,q:q,t:Date.now()});qs[i]=1;save();render();toast("✓ Added "+q+" × "+MENU[i][0]+" · "+m.toUpperCase()+" · "+inr(MENU[i][1]*q))}
function undo(){var x=D().s.pop();save();render();toast(x?"Removed: "+(x.q||1)+" × "+MENU[x.i][0]:"Nothing to undo")}
function delS(k){D().s.splice(k,1);save();render();toast("Entry removed")}
function setF(k,v){D()[k]=v;save();renderSum()}
function addE(m){var a=+document.getElementById("ea").value;if(!a)return;D().e.push({a:a,n:document.getElementById("en").value||"Expense",m:m});document.getElementById("ea").value="";document.getElementById("en").value="";save();render()}
function delE(k){D().e.splice(k,1);save();render()}
function calc(){var d=D(),r={cash:0,upi:0,n:0,ec:0,eu:0};d.s.forEach(function(x){var q=x.q||1;r[x.m]+=MENU[x.i][1]*q;r.n+=q});d.e.forEach(function(x){if(x.m=="cash")r.ec+=x.a;else r.eu+=x.a});r.tot=r.cash+r.upi;return r}
function renderSum(){var d=D(),r=calc();
document.getElementById("sum").innerHTML="<tr><td>Items sold</td><td>"+r.n+"</td></tr><tr><td>Cash sales</td><td>"+inr(r.cash)+"</td></tr><tr><td>UPI sales</td><td>"+inr(r.upi)+"</td></tr><tr><td>Total sales</td><td>"+inr(r.tot)+"</td></tr><tr><td>Expenses (cash / UPI)</td><td>"+inr(r.ec)+" / "+inr(r.eu)+"</td></tr>";
var exp=(+d.open||0)+r.cash-r.ec,diff=(+d.cnt||0)-exp,has=d.cnt!=="";
document.getElementById("chk").innerHTML="<tr><td>Cash that should be in hand</td><td>"+inr(exp)+"</td></tr><tr><td>UPI that should have arrived</td><td>"+inr(r.upi)+"</td></tr>"+(has?"<tr><td>Cash difference</td><td class='"+(diff==0?"ok":"no")+"'>"+(diff==0?"Matches":(diff>0?"+":"−")+inr(Math.abs(diff))+(diff>0?" extra":" short"))+"</td></tr>":"")}
function render(){var d=D();
document.getElementById("dt").textContent=new Date().toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"});
document.getElementById("menu").innerHTML=MENU.map(function(m,i){var c=soldOf(i),st=stat(i);return "<div class='card'><div class='nm'><b>"+m[0]+"</b><span>"+inr(m[1])+" · sold "+c+st+"</span></div><div class='item2'><div class='stp'><button class='g qb' onclick='stp("+i+",-1)'>−</button><b>"+qs[i]+"</b><button class='g qb' onclick='stp("+i+",1)'>+</button></div><button class='c' onclick='add("+i+",\"cash\")'>Cash</button><button class='u' onclick='add("+i+",\"upi\")'>UPI</button></div></div>"}).join("");
document.getElementById("open").value=d.open;document.getElementById("cnt").value=d.cnt;syncStock();
document.getElementById("slog").innerHTML=d.s.length?d.s.slice().reverse().map(function(x,k){return "<div class='log'><span>"+new Date(x.t).toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"})+" · "+MENU[x.i][0]+(x.q>1?" ×"+x.q:"")+" · "+x.m.toUpperCase()+"</span><b>"+inr(MENU[x.i][1]*(x.q||1))+" <a href='#' onclick='delS("+(d.s.length-1-k)+");return false' style='color:var(--bad);margin-left:8px'>✕</a></b></div>"}).join(""):"<span class='sm'>No sales yet.</span>";
document.getElementById("elog").innerHTML=d.e.map(function(x,k){return "<div class='log'><span>"+x.n.replace(/</g,"&lt;")+" · "+x.m.toUpperCase()+"</span><span>"+inr(x.a)+" <a href='#' onclick='delE("+k+");return false' style='color:var(--bad)'>remove</a></span></div>"}).join("");
renderSum();
var ks=Object.keys(days).filter(function(k){return k!=T&&days[k].s.length}).sort().reverse().slice(0,14);
document.getElementById("hist").innerHTML=ks.length?ks.map(function(k){var o=days[k],c=0,u=0;o.s.forEach(function(x){var v=MENU[x.i][1]*(x.q||1);if(x.m=="cash")c+=v;else u+=v});return "<div class='log'><span>"+k+"</span><span>Cash "+inr(c)+" · UPI "+inr(u)+" · <b>"+inr(c+u)+"</b></span></div>"}).join(""):"<span class='sm'>Earlier days will show here.</span>"}
function copySum(){var r=calc(),d=D(),t="Karavali Bites – "+T+"\nItems sold: "+r.n+"\nCash sales: "+inr(r.cash)+"\nUPI sales: "+inr(r.upi)+"\nTotal: "+inr(r.tot)+"\nExpenses: cash "+inr(r.ec)+", UPI "+inr(r.eu)+"\nExpected cash in hand: "+inr((+d.open||0)+r.cash-r.ec)+MENU.map(function(mn,i){var p=d.p[i];return p==null||p===""?"":"\n"+mn[0]+": prepared "+p+", sold "+soldOf(i)+", left "+(p-soldOf(i))}).join("");
var m=document.getElementById("msg");
try{navigator.clipboard.writeText(t).then(function(){m.textContent="Summary copied."},function(){m.textContent=t})}catch(e){m.textContent=t}}
function pdf(){var m=document.getElementById("msg");if(!window.jspdf){m.textContent="PDF tool did not load. Check internet and try again.";return}var d=D(),r=calc(),doc=new window.jspdf.jsPDF(),y=18;function L(t,b){if(y>280){doc.addPage();y=18}doc.setFont("helvetica",b?"bold":"normal");doc.text(String(t).replace(/[^ -~]/g,"?"),14,y);y+=7}function R(n){return "Rs. "+Number(n||0).toLocaleString("en-IN")}try{doc.addImage(document.getElementById("lg"),"PNG",166,8,28,28)}catch(x){}doc.setFontSize(16);L("Karavali Bites - Daily Report",1);doc.setFontSize(11);L("Date: "+T);y+=3;L("Item | Cash qty | UPI qty | Amount",1);MENU.forEach(function(mn,i){var c=0,u=0;d.s.forEach(function(x){if(x.i==i){if(x.m=="cash")c+=x.q||1;else u+=x.q||1}});if(c+u)L(mn[0]+" | "+c+" | "+u+" | "+R(mn[1]*(c+u)))});y+=3;if(d.p.some(function(v){return v!=null&&v!==""})){L("Stock (prepared / sold / left)",1);MENU.forEach(function(mn,i){var p=d.p[i];if(p==null||p==="")return;var s=soldOf(i);L(mn[0]+": "+p+" / "+s+" / "+(p-s))});y+=3}L("Items sold: "+r.n);L("Cash sales: "+R(r.cash));L("UPI sales: "+R(r.upi));L("Total sales: "+R(r.tot),1);y+=3;L("Expenses (cash): "+R(r.ec));L("Expenses (UPI): "+R(r.eu));d.e.forEach(function(x){L("  - "+x.n+" ("+x.m+"): "+R(x.a))});var ex=(+d.open||0)+r.cash-r.ec;y+=3;L("Opening cash: "+R(d.open));L("Expected cash in hand: "+R(ex),1);if(d.cnt!==""){var df=(+d.cnt)-ex;L("Cash counted: "+R(d.cnt));L("Difference: "+(df==0?"Matches":(df>0?"+":"-")+R(Math.abs(df))))}var blob=doc.output("blob"),fn="KaravaliBites-"+T+".pdf";var cu=window.claude&&window.claude.use?window.claude.use("downloads"):Promise.resolve(null);cu.then(function(dl){if(!dl){doc.save(fn);m.textContent="Report downloaded. Send it on WhatsApp.";return}return dl.save({filename:fn,data:blob}).then(function(){m.textContent="Report saved. Send it on WhatsApp."},function(e){if(e&&e.code!="declined")m.textContent="Could not save the PDF. Use Copy summary."})})}
var rc=0;function resetDay(){var b=document.getElementById("rb");if(!rc){rc=1;b.textContent="Tap again to clear everything";toast("Tap Clear again to confirm");clearTimeout(window._rt);window._rt=setTimeout(function(){rc=0;b.textContent="Clear today"},4000);return}rc=0;clearTimeout(window._rt);b.textContent="Clear today";T=dk();days[T]={open:"",cnt:"",s:[],e:[],p:[]};save();render();toast("Today’s entries cleared")}
document.addEventListener("visibilitychange",function(){if(!document.hidden)render()});
load();buildStock();render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
</script>
</body>
</html>
